<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Visibility Map · Global Financial Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" crossorigin href="./assets/index-BPJ6mFt4.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const JS_BASE =
        'https://raw.githubusercontent.com/ryan-stout/ryan-stout.github.io/js-shards-c08-c72/assets/';

      async function loadText(url) {
        const r = await fetch(url);
        if (!r.ok) throw new Error(url + ' ' + r.status);
        return (await r.text()).replace(/\s+/g, '');
      }

      async function loadB64(urlFor, count) {
        const parts = await Promise.all(
          Array.from({ length: count }, (_, i) => loadText(urlFor(i))),
        );
        return Uint8Array.from(atob(parts.join('')), (c) => c.charCodeAt(0));
      }

      try {
        const [current, future] = await Promise.all([
          loadB64((i) => './media/landscape.gif.' + String(i).padStart(3, '0'), 27),
          loadB64((i) => './media/landscape-future.gif.' + String(i).padStart(3, '0'), 26),
        ]);
        window.__CSE_GIFS = {
          current: URL.createObjectURL(new Blob([current], { type: 'image/gif' })),
          future: URL.createObjectURL(new Blob([future], { type: 'image/gif' })),
        };
      } catch (err) {
        console.warn('gif reconstruct failed', err);
      }

      const js = await loadB64(
        (i) => JS_BASE + 'index-amixg-Oy.js.c' + String(i).padStart(2, '0'),
        73,
      );
      await import(URL.createObjectURL(new Blob([js], { type: 'text/javascript' })));
    </script>
  </body>
</html>
