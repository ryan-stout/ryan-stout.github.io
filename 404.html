<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Visibility Map · Global Financial Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" crossorigin href="./assets/index-BPJ6mFt4.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      async function loadText(path) {
        const r = await fetch(path);
        if (!r.ok) throw new Error(path + ' ' + r.status);
        return (await r.text()).replace(/\s+/g, '');
      }

      async function loadGif(name, count) {
        const parts = await Promise.all(
          Array.from({ length: count }, (_, i) =>
            loadText('./chunks/' + name + '.' + String(i).padStart(3, '0')),
          ),
        );
        const bin = Uint8Array.from(atob(parts.join('')), (c) => c.charCodeAt(0));
        return URL.createObjectURL(new Blob([bin], { type: 'image/gif' }));
      }

      async function loadApp() {
        try {
          await import('./assets/index-amixg-Oy.js');
          return;
        } catch (err) {
          console.warn('full bundle missing, loading parts', err);
        }
        const remoteBase = 'https://raw.githubusercontent.com/ryan-stout/ryan-stout.github.io/js-shards-c08-c72/assets/';
        const b64parts = await Promise.all(
          Array.from({ length: 73 }, (_, i) => {
            const name = 'index-amixg-Oy.js.c' + String(i).padStart(2, '0');
            return fetch('./assets/' + name).then(async (r) => {
              if (!r.ok) throw new Error('js b64 part ' + i);
              return (await r.text()).replace(/\s+/g, '');
            }).catch(async () => {
              const r = await fetch(remoteBase + name);
              if (!r.ok) throw new Error('js b64 part ' + i);
              return (await r.text()).replace(/\s+/g, '');
            });
          }),
        );
        const bin = Uint8Array.from(atob(parts.join('')), (c) => c.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([bin], { type: 'text/javascript' }));
        await import(url);
      }

      try {
        window.__CSE_GIFS = {
          current: await loadGif('landscape.gif', 11),
          future: await loadGif('landscape-future.gif', 11),
        };
      } catch (err) {
        console.warn('gif reconstruct failed', err);
      }
      await loadApp();
    </script>
  </body>
</html>
