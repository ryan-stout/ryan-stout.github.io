<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Visibility Map · Global Financial Enterprise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" crossorigin href="./assets/index-BPJ6mFt4.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      async function loadGif(name, count) {
        const texts = await Promise.all(
          Array.from({ length: count }, (_, i) =>
            fetch('./chunks/' + name + '.' + String(i).padStart(3, '0')).then((r) => {
              if (!r.ok) throw new Error('missing ' + name + ' ' + i);
              return r.text();
            }),
          ),
        );
        const bin = Uint8Array.from(atob(texts.join('')), (c) => c.charCodeAt(0));
        return URL.createObjectURL(new Blob([bin], { type: 'image/gif' }));
      }

      async function loadApp() {
        try {
          await import('./assets/index-amixg-Oy.js');
          return;
        } catch (err) {
          console.warn('full bundle missing, loading parts', err);
        }
        const parts = [];
        for (let i = 0; i < 10; i++) {
          parts.push(
            fetch('./assets/index-amixg-Oy.js.part' + String(i).padStart(2, '0')).then((r) => {
              if (!r.ok) throw new Error('js part ' + i);
              return r.text();
            }),
          );
        }
        const code = (await Promise.all(parts)).join('');
        const url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        await import(url);
      }

      window.__CSE_GIFS = {
        current: await loadGif('landscape.gif', 94),
        future: await loadGif('landscape-future.gif', 93),
      };
      await loadApp();
    </script>
  </body>
</html>
